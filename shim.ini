; MooseShim configuration. Must sit next to MooseShim.dll.

[target]
; Full path to the real 32-bit J2534 driver.
; Adapter installed on the development machine: MongoosePro JLR.
library=C:\Program Files (x86)\Drew Technologies, Inc\J2534\MongoosePro JLR\monpj432.dll

; auto | generic | mongoose. Per-feature keys in [channel] override the profile.
; "auto" enables only refusal-driven compatibility; it does not mask an
; unacknowledged functional write. This installation is qualified on Mongoose.
adapter_profile=mongoose

; Tests override the target driver with VOLVOSHIM_TARGET=mockj2534.dll.

; Device name passed to PassThruOpen. SDA uses the registry name here, but
; DrewTech treats pName as a selector and returns ERR_DEVICE_NOT_CONNECTED.
; Empty means NULL, i.e. the first available device per J2534 v04.04.
device_name=
; Enable only when the target driver requires a host-supplied name:
forward_device_name=0

[intercept]
; Values: forward | absorb | reject.
;
; Keys are bare names (all number spaces) or category-qualified names/numbers:
; config:, ioctl:, protocol:, or flag:. Qualification is required because
; 0x10000001 is both CAN_XON_XOFF and CAN_XON_XOFF_STMIN. Bare numeric keys and
; unresolved names are ignored and logged.

; Two vendor SET_CONFIG parameters sent by SDA (0x10000002 / 0x10000001).
ISO15765_SWDL_FABRICATE=absorb
CAN_XON_XOFF_STMIN=absorb

; DiCE vendor ioctls. Both collide with DrewTech DT_READ_DIO / DT_WRITE_DIO.
DICE_CAN_XON_XOFF_FILTER=absorb
DICE_CAN_XON_XOFF_FILTER_ACTIVE=absorb

; Vendor bits in flag words. PassThruConnect Flags and message TxFlags are
; separate bit spaces and are filtered independently:
;
;   flag:FUNC_ADDR        0x10000000 in Connect Flags (DrewTech SNIFF_MODE)
;   flag:PHYSICAL_CHANNEL 0x20000000 in Connect Flags; standard J2534-2 MS select
;   flag:TX_FUNC_ADDR     0x10000000 in TxFlags
;   flag:TX_BIT29         0x20000000 in TxFlags; undefined by v04.04, but set by SDA
;
; TxFlags strips bits 28..31; Connect Flags strips only 0x10000000.
flag:FUNC_ADDR=absorb
flag:TX_FUNC_ADDR=absorb
flag:TX_BIT29=absorb

; The DiCE vendor protocol used by D2 platforms (P80/P1/P2). Not emulatable
; over a generic J2534 device because its framing is adapter-specific.
CAN_XON_XOFF=reject

; Configure a specific unnamed ID with a category-qualified numeric key:
; config:0x10000003=forward

; Unlisted IDs in the vendor range (>= 0x10000000) are absorbed because DiCE
; and DrewTech assign different meanings to them. IDs below that range are
; forwarded; absorbing them would report STATUS_NOERROR without applying a setting.
absorb_unknown_vendor_ids=1

[channel]
; SDA opens MS as ISO15765 + PHYSICAL_CHANNEL (0x20000000). Adapters without
; a second physical CAN return ERR_INVALID_FLAGS; MongoosePro JLR does this.
; With ms_fallback=1, retry as ISO15765_PS with J1962_PINS, matching VolvoTools
; (Common/src/Util.cpp, openUDSChannel). The direct attempt remains first, so
; adapters with a real second channel keep their normal behavior.
; The fallback also sets LOOPBACK=0. Otherwise Mongoose queues TX indications
; as RX messages, and periodic TesterPresent traffic can hide the ECU response.
ms_fallback=1
ms_pins=0x030B

; CLEAR_RX_BUFFER is a standard v04.04 ioctl. DiCE supports it, but MongoosePro
; JLR returns ERR_FAILED. SDA calls it before every request; without it, the
; previous TX indication remains queued and the first read returns the host's
; own echo instead of the ECU response. When enabled, drain the queue and return
; STATUS_NOERROR after the failed ioctl.
;
; This is the only standard ioctl that the shim may report as successful after
; the target rejects it. The postcondition is satisfied because the queue is
; empty; if draining fails, return the driver's original error.
emulate_clear_rx_buffer=1

; SDA wakes both buses with functional frames to 0x7DF. On a bus without an
; ECU, Mongoose waits for a CAN ACK and returns ERR_TIMEOUT, aborting the flow.
; A missing recipient is normal for a functional broadcast, so only this timeout
; is normalized to success. Physical requests and other errors are unchanged.
tolerate_unacked_functional_broadcasts=1

; Mongoose returns ERR_BUFFER_EMPTY when a blocking ReadMsgs expires with no
; messages. J2534/SDA expect ERR_TIMEOUT for that case. Timeout=0 reads keep
; ERR_BUFFER_EMPTY so queue polling and CLEAR_RX_BUFFER emulation still work.
normalize_empty_blocking_read=1

; SDA sometimes calls StopMsgFilter with the channel of the other CAN bus.
; Redirect only when the FilterID has one unambiguous owner on this device.
repair_cross_channel_filter_stop=1

; Experimental Volvo D2/DII translation. reject is the safe default. Other
; routes use standard CAN/CAN_PS only; the vendor protocol never reaches the
; target driver.
d2_route=reject
d2_ms_pins=0x030B
d2_ignore_intermediate_tx_ack=1

[log]
; %VARS% are expanded. Empty path means <dll dir>\mooseshim.log
path=%TEMP%\mooseshim.log
; off | error | info | debug | trace. Use trace only for short captures: it
; records every J2534 call. Logs rotate at 10 MiB and keep five .1-.5 generations;
; message payloads are capped at 64 bytes in the log (DataSize stays exact).
level=debug
