name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-test-package-release:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate tag and product name
        shell: pwsh
        run: |
          $match = Select-String -Path CMakeLists.txt -Pattern '^\s*set\(SHIM_NAME "([^"]+)"'
          if (-not $match) {
            throw 'SHIM_NAME was not found in CMakeLists.txt'
          }

          $versionMatch = Select-String -Path CMakeLists.txt -Pattern '^\s*set\(SHIM_VERSION "([^"]+)"'
          if (-not $versionMatch) {
            throw 'SHIM_VERSION was not found in CMakeLists.txt'
          }

          $shimName = $match.Matches[0].Groups[1].Value
          $version = $versionMatch.Matches[0].Groups[1].Value
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $($env:GITHUB_REF_NAME) does not match CMake version $expectedTag"
          }

          "SHIM_NAME=$shimName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-release -G "Visual Studio 17 2022" -A Win32

      - name: Build
        shell: pwsh
        run: cmake --build build-release --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build-release -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $packageDir = 'package'
          $archive = "dist/$env:SHIM_NAME-$env:GITHUB_REF_NAME.zip"
          New-Item -ItemType Directory -Force -Path "$packageDir/tools", 'dist' | Out-Null

          Copy-Item "build-release/Release/$env:SHIM_NAME.dll" $packageDir
          Copy-Item "build-release/Release/$env:SHIM_NAME.ini" $packageDir
          Copy-Item 'tools/register.reg.template' "$packageDir/tools"
          Copy-Item 'README.md' $packageDir

          Compress-Archive -Path "$packageDir/*" -DestinationPath $archive -Force

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "dist/$env:SHIM_NAME-$env:GITHUB_REF_NAME.zip" `
            --verify-tag `
            --title $env:GITHUB_REF_NAME `
            --generate-notes
